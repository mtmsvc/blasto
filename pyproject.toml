[project]
name = "blasto"
version = "0.1.0"
description = "Backend for the website of a Latvian driving school"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-env>=1.8.1",
    "ruff>=0.16.10",
]

[tool.ruff]
lint.extend-select = ["I"]

[tool.mypy]
strict = true

[tool.pytest_env]
DATABASE_URL = {value = "postgresql+asyncpg://blasto:blasto@localhost:5432/blasto_test", skip_if_set = true}
ADMIN_API_KEY = "test-admin-key"
